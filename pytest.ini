[pytest]
minversion = 8.0
addopts =
    -ra
    --strict-markers
    --tb=short
    -q

testpaths =
    tests/unit

python_files   = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: marks tests as integration tests (require live Azure services)
    slow: marks tests as slow-running

asyncio_mode = auto

# Coverage defaults (override on CLI with --cov flags)
; addopts = --cov=agents --cov=shared --cov=api --cov-report=term-missing

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:opentelemetry.*
