# Run the whole stack on your own machine with free software only:
#   Ollama (local LLM) + PostgreSQL + the API + a worker (+ optional webhook tunnel).
#
#   cp .env.example .env        # then edit the DA_* values you need
#   docker compose up -d --build
#   docker compose logs -f worker
#
# Everything binds to 127.0.0.1; nothing is exposed to your network. See docs/local-docker.md.

name: devopsagents

x-app: &app
  build:
    context: .
    dockerfile: infra/container/Dockerfile
  image: devopsagents:local
  restart: unless-stopped
  environment: &app-env
    DA_ENVIRONMENT: local
    DA_DATABASE_URL: postgresql+psycopg://devopsagents:${POSTGRES_PASSWORD:-devopsagents}@postgres:5432/devopsagents
    DA_CREATE_SCHEMA: "false" # schema is managed by the migrate service
    # LLM: Ollama in this stack by default. COMPOSE_LLM_BASE_URL exists because a localhost URL from .env
    # would be wrong inside a container.
    DA_LLM_PROVIDER: openai_compat
    DA_LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-http://ollama:11434/v1}
    DA_LLM_API_KEY: ${DA_LLM_API_KEY:-}
    DA_LLM_MODEL_LARGE: ${DA_LLM_MODEL_LARGE:-qwen2.5-coder:7b}
    DA_LLM_MODEL_SMALL: ${DA_LLM_MODEL_SMALL:-qwen2.5-coder:7b}
    DA_LLM_JSON_MODE: ${DA_LLM_JSON_MODE:-true}
    DA_REVIEW_CHUNK_TOKENS: ${DA_REVIEW_CHUNK_TOKENS:-4000}
    # GitHub: a token works without a GitHub App. Empty values make the endpoints reject everything.
    DA_GITHUB_TOKEN: ${DA_GITHUB_TOKEN:-}
    DA_GITHUB_WEBHOOK_SECRET: ${DA_GITHUB_WEBHOOK_SECRET:-}
    DA_ALERT_TOKEN: ${DA_ALERT_TOKEN:-}
    DA_ADMIN_TOKEN: ${DA_ADMIN_TOKEN:-}
    DA_METRICS_TOKEN: ${DA_METRICS_TOKEN:-} # /metrics is disabled until this is set
    DA_KILL_SWITCH: ${DA_KILL_SWITCH:-false}
    # Free incident path (docs/free-incidents.md); all optional.
    DA_PROMETHEUS_URL: ${DA_PROMETHEUS_URL:-}
    DA_PROMETHEUS_TOKEN: ${DA_PROMETHEUS_TOKEN:-}
    DA_RUNBOOK_REPO: ${DA_RUNBOOK_REPO:-}
    DA_RUNBOOK_WORKFLOW: ${DA_RUNBOOK_WORKFLOW:-runbook.yml}
    DA_RUNBOOK_REF: ${DA_RUNBOOK_REF:-main}
    DA_INCIDENT_REPO: ${DA_INCIDENT_REPO:-}
    DA_ADMIN_AUTH: ${DA_ADMIN_AUTH:-token}
    DA_APPROVER_REPO: ${DA_APPROVER_REPO:-}
    DA_APPROVERS: ${DA_APPROVERS:-}
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Ollama's default context window is small and silently truncates long prompts.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama:/root/.ollama
    ports: ["127.0.0.1:11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    # NVIDIA GPU (optional): uncomment, and install the NVIDIA container toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot: downloads the model into the ollama volume the first time (several GB), then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${DA_LLM_MODEL_LARGE:-qwen2.5-coder:7b}"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devopsagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devopsagents}
      POSTGRES_DB: devopsagents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsagents -d devopsagents"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Not published to the host on purpose; only the other services can reach it.

  migrate:
    <<: *app
    restart: "no"
    command: ["devopsagents", "migrate"]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["devopsagents", "worker"] # handles review, security and incident jobs
    healthcheck: { disable: true } # the image healthcheck probes the API port
    depends_on:
      migrate: { condition: service_completed_successfully }
      ollama-pull: { condition: service_completed_successfully }

  # Optional: forwards GitHub webhooks from a free smee.io channel to the local API (no inbound ports).
  #   docker compose --profile webhooks up -d
  # Create a channel at https://smee.io, put its URL in SMEE_URL, and add it as the repo webhook URL
  # (content type application/json, secret = DA_GITHUB_WEBHOOK_SECRET, event: Pull requests).
  # Privacy: smee.io is a public relay; payloads pass through it. Use a tunnel you trust for private repos.
  smee:
    profiles: ["webhooks"]
    image: node:22-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        [ -n "$$SMEE_URL" ] || { echo "Set SMEE_URL to your smee.io channel URL"; exit 1; };
        npx --yes smee-client@3 --url "$$SMEE_URL" --target http://api:8000/webhooks/github
    environment:
      SMEE_URL: ${SMEE_URL:-}
    depends_on: [api]

  # ---- Optional observability (free): docker compose --profile observability up -d ----------------------
  # Prometheus scrapes the agents' /metrics, evaluates alerts about the agents themselves, and Alertmanager
  # forwards them to the agents' webhook. Grafana ships with one dashboard. All bound to 127.0.0.1.
  # Needs DA_METRICS_TOKEN (and DA_ALERT_TOKEN for alert delivery) in .env. Set DA_PROMETHEUS_URL=http://prometheus:9090
  # to let the incident agent read evidence and verify recovery from this Prometheus.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf %s "$$DA_METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d
    environment:
      DA_METRICS_TOKEN: ${DA_METRICS_TOKEN:-}
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf %s "$$DA_ALERT_TOKEN" > /tmp/alert_token &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    environment:
      DA_ALERT_TOKEN: ${DA_ALERT_TOKEN:-}
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    depends_on: [api]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin} # change it; reachable from this machine only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  ollama:
  pgdata:
  prometheus:
  alertmanager:
  grafana:
