name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests evals
          .venv/bin/ruff format --check src tests evals
      - name: Types (strict)
        run: .venv/bin/mypy -p devopsagents
      - name: Architecture layering
        run: .venv/bin/lint-imports
      - name: Validate runbooks, policy, prompts
        run: .venv/bin/devopsagents check-config
      - name: Tests
        run: .venv/bin/pytest --cov=devopsagents --cov-report=term-missing --cov-fail-under=80
      - name: Offline eval harness
        run: .venv/bin/python -m evals.run_evals --offline

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/container/Dockerfile
          push: false
          load: true
          tags: devopsagents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devopsagents:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
