name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests evals
          .venv/bin/ruff format --check src tests evals
          .venv/bin/shellcheck scripts/*.sh
      - name: Types (strict)
        run: .venv/bin/mypy -p devopsagents
      - name: Architecture layering
        run: .venv/bin/lint-imports
      - name: Validate runbooks, policy, prompts
        run: .venv/bin/devopsagents check-config
      - name: Build sandbox image (enables the real-container isolation tests)
        run: docker build -t devopsagents-sandbox infra/sandbox
      - name: Tests
        run: .venv/bin/pytest --cov=devopsagents --cov-report=term-missing --cov-fail-under=80
      - name: Offline eval harness
        run: .venv/bin/python -m evals.run_evals --offline

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/container/Dockerfile
          push: false
          load: true
          tags: devopsagents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate compose file
        run: docker compose config -q && SMEE_URL=https://smee.io/x docker compose --profile webhooks config -q
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devopsagents:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
