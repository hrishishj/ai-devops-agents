name: AI Test & Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ai-security-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ai-test-security:
    name: Test Coverage & Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run existing test suite
        run: |
          pytest tests/unit/ -v --tb=short \
            --junitxml=test-results/unit-results.xml \
            --cov=agents --cov=shared \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        continue-on-error: true

      - name: AI Test & Security Analysis
        if: github.event_name == 'pull_request'
        env:
          AZURE_OPENAI_ENDPOINT:     ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY:      ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT:   ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          COSMOS_ENDPOINT:           ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY:                ${{ secrets.COSMOS_KEY }}
          REDIS_HOST:                ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD:            ${{ secrets.REDIS_PASSWORD }}
          REDIS_SSL:                 "true"
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_ID:             ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY:    ${{ secrets.GH_APP_PRIVATE_KEY }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          OTEL_SERVICE_NAME:         "test-security-action"
        run: |
          python -c "
          from agents.test_security.agent import TestSecurityAgent
          agent = TestSecurityAgent()
          agent.__post_init__()
          agent.handle_pr(
              '${{ github.repository }}',
              ${{ github.event.pull_request.number }}
          )
          print('Security scan complete.')
          "

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results/**/*.xml"
          check_name: Unit Test Results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
