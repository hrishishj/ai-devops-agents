name: IT Ops Alert Analysis

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: Azure Monitor alert ID
        required: true
      source:
        description: Alert source system
        required: true
        default: azure_monitor
      log_payload:
        description: JSON-encoded log payload (base64)
        required: true

  repository_dispatch:
    types: [azure-monitor-alert]

jobs:
  analyse-alert:
    name: IT Ops Agent Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode log payload
        id: decode
        run: |
          # workflow_dispatch passes base64, repository_dispatch passes raw JSON
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo '${{ github.event.inputs.log_payload }}' | base64 -d > /tmp/log_payload.json
            ALERT_ID="${{ github.event.inputs.alert_id }}"
            SOURCE="${{ github.event.inputs.source }}"
          else
            echo '${{ github.event.client_payload.log_payload }}' > /tmp/log_payload.json
            ALERT_ID="${{ github.event.client_payload.alert_id }}"
            SOURCE="${{ github.event.client_payload.source }}"
          fi
          echo "alert_id=${ALERT_ID}" >> $GITHUB_OUTPUT
          echo "source=${SOURCE}" >> $GITHUB_OUTPUT

      - name: Run IT Ops Agent
        id: analysis
        env:
          AZURE_OPENAI_ENDPOINT:         ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY:           ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT:        ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          COSMOS_ENDPOINT:               ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY:                    ${{ secrets.COSMOS_KEY }}
          REDIS_HOST:                    ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD:                ${{ secrets.REDIS_PASSWORD }}
          AZURE_AUTOMATION_ACCOUNT_URL:  ${{ secrets.AZURE_AUTOMATION_ACCOUNT_URL }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          OTEL_SERVICE_NAME:             "it-ops-action"
          AZURE_CLIENT_ID:               ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:           ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:               ${{ secrets.AZURE_TENANT_ID }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from agents.it_ops.agent import ItOpsAgent

          with open('/tmp/log_payload.json') as f:
              log_payload = f.read()

          agent = ItOpsAgent()
          agent.__post_init__()
          result = agent.handle_alert(
              alert_id='${{ steps.decode.outputs.alert_id }}',
              source='${{ steps.decode.outputs.source }}',
              log_payload=log_payload,
          )
          print(json.dumps(result, indent=2))

          # Write outputs for subsequent steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"outcome={result['outcome']}\n")
              fh.write(f"severity={result.get('severity', 'unknown')}\n")
              fh.write(f"confidence={result.get('confidence', 0)}\n")
          EOF

      - name: Create GitHub Issue for escalated alerts
        if: steps.analysis.outputs.outcome == 'escalated' || steps.analysis.outputs.outcome == 'draft_created'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome  = '${{ steps.analysis.outputs.outcome }}';
            const severity = '${{ steps.analysis.outputs.severity }}';
            const alertId  = '${{ steps.decode.outputs.alert_id }}';
            const conf     = '${{ steps.analysis.outputs.confidence }}';

            const sevLabel = { critical: '🔴', high: '🟠', medium: '🟡', low: '🔵' };
            const icon = sevLabel[severity] || '⚪';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `${icon} [${severity.toUpperCase()}] IT Ops Alert: ${alertId}`,
              body: [
                `## IT Ops Alert — ${outcome.replace('_', ' ').toUpperCase()}`,
                '',
                `| Field       | Value |`,
                `|-------------|-------|`,
                `| Alert ID    | \`${alertId}\` |`,
                `| Severity    | ${severity} |`,
                `| Outcome     | ${outcome} |`,
                `| Confidence  | ${parseFloat(conf).toFixed(2)} |`,
                '',
                `> This issue was automatically created by the IT Ops Agent.`,
                `> Review the [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for the full ticket draft.`,
              ].join('\n'),
              labels: ['it-ops', 'automated', severity],
            });

      - name: Summary
        run: |
          echo "### IT Ops Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Alert ID | \`${{ steps.decode.outputs.alert_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Outcome | \`${{ steps.analysis.outputs.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | \`${{ steps.analysis.outputs.severity }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Confidence | \`${{ steps.analysis.outputs.confidence }}\` |" >> $GITHUB_STEP_SUMMARY
