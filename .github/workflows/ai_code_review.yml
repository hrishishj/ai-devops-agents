name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-code-review:
    name: Coding Co-Pilot Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trigger AI Code Review
        env:
          AZURE_OPENAI_ENDPOINT:     ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY:      ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT:   ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          COSMOS_ENDPOINT:           ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY:                ${{ secrets.COSMOS_KEY }}
          REDIS_HOST:                ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD:            ${{ secrets.REDIS_PASSWORD }}
          REDIS_SSL:                 "true"
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_ID:             ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY:    ${{ secrets.GH_APP_PRIVATE_KEY }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          OTEL_SERVICE_NAME:         "coding-copilot-action"
        run: |
          python -c "
          from agents.coding_copilot.agent import CodingCopilotAgent
          agent = CodingCopilotAgent()
          agent.__post_init__()
          agent.handle_pr(
              '${{ github.repository }}',
              ${{ github.event.pull_request.number }}
          )
          print('Code review complete.')
          "

      - name: Upload review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-logs-${{ github.event.pull_request.number }}
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
