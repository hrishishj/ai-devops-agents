[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devopsagents"
version = "0.1.0"
description = "Policy-gated AI agents for code review, security triage and IT incident response."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "pyjwt[crypto]>=2.8",
  "tenacity>=8.3",
  "alembic>=1.13",
]

[project.optional-dependencies]
azure = [
  "openai>=1.40",
  "azure-identity>=1.17",
  "azure-servicebus>=7.12",
  "psycopg[binary]>=3.2",
  "opentelemetry-sdk>=1.25",
  "azure-monitor-opentelemetry-exporter>=1.0.0b25",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
devopsagents = "devopsagents.apps.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devopsagents"]

# Ship prompts, runbooks and policies inside the wheel so `pip install` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "devopsagents/_data/prompts"
"runbooks" = "devopsagents/_data/runbooks"
"policies" = "devopsagents/_data/policies"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs live external services"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501", "B017", "RUF012", "RUF059", "RUF015"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.*", "openai.*", "jwt.*", "opentelemetry.sdk.*"]
ignore_missing_imports = true

# Layering: domain <- core <- integrations <- agents <- apps
[tool.importlinter]
root_package = "devopsagents"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "devopsagents.apps",
  "devopsagents.agents",
  "devopsagents.integrations",
  "devopsagents.core",
  "devopsagents.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["devopsagents.domain"]
forbidden_modules = ["sqlalchemy", "httpx", "fastapi", "openai", "azure"]
