# Routes alerts to the agents' Alertmanager webhook. The token file is written from DA_ALERT_TOKEN at
# container start. Add your own receivers (email, chat) next to `ai-agents` for human notification.
route:
  receiver: ai-agents
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: ai-agents
    webhook_configs:
      - url: http://api:8000/webhooks/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/alert_token
