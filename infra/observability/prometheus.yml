# Prometheus for the local Compose stack (profile: observability). Scrapes the agents' /metrics and
# evaluates alerts.yml. The bearer token file is written from DA_METRICS_TOKEN at container start.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: devopsagents
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8000"]
